name: Build Mini Racing IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project MiniRacing.xcodeproj \
            -scheme MiniRacing \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiniRacing.app Payload/
          zip -r MiniRacing.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiniRacing-IPA
          path: MiniRacing.ipa
          if-no-files-found: error
          retention-days: 14