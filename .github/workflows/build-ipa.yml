
name: Build Mini Racing IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen
          xcodegen --version

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build iOS app
        run: |
          xcodebuild \
            -project MiniRacing.xcodeproj \
            -scheme MiniRacing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Verify application
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MiniRacing.app"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: MiniRacing.app was not created."
            find build/Build/Products -maxdepth 4 -print || true
            exit 1
          fi

          echo "Application found:"
          ls -la "$APP_PATH"

      - name: Package IPA
        run: |
          rm -rf Payload MiniRacing.ipa
          mkdir Payload

          cp -R \
            build/Build/Products/Release-iphoneos/MiniRacing.app \
            Payload/

          /usr/bin/zip -r MiniRacing.ipa Payload

          test -f MiniRacing.ipa
          unzip -l MiniRacing.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRacing-IPA
          path: MiniRacing.ipa
          if-no-files-found: error
          retention-days: 14
