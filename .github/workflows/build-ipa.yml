
name: Build Mini Racing IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build iOS IPA
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Check project files
        run: |
          test -f project.yml
          test -f MiniRacing/Info.plist
          test -f MiniRacing/GameScene.swift
          test -f MiniRacing/MultiplayerManager.swift

      - name: Generate Xcode project
        run: |
          xcodegen generate

      - name: Build iOS application
        run: |
          xcodebuild \
            -project MiniRacing.xcodeproj \
            -scheme MiniRacing \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_IDENTITY="" \
            build

      - name: Verify application
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MiniRacing.app"
          test -d "$APP_PATH"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist"

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MiniRacing.app Payload/
          /usr/bin/zip -r MiniRacing.ipa Payload
          test -f MiniRacing.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiniRacing-IPA
          path: MiniRacing.ipa
          if-no-files-found: error
          retention-days: 14
