name: MiniRacing

options:
  bundleIdPrefix: com.ismayil
  deploymentTarget:
    iOS: "12.0"
  createIntermediateGroups: true

targets:
  MiniRacing:
    type: application
    platform: iOS
    deploymentTarget: "12.0"

    sources:
      - path: MiniRacing

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ismayil.miniracing
        PRODUCT_NAME: Mini Racing
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "12.0"
        INFOPLIST_FILE: MiniRacing/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        ENABLE_BITCODE: NO